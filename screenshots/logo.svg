<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 160" role="img" aria-labelledby="title description">
	<title id="title">Lodash Challenges</title>
	<desc id="description">An animated blue Lodash Challenges logo.</desc>
	<style>.title {
			fill: #111827;
			font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			font-size: 36px;
			font-weight: 700;
			letter-spacing: 0.2px;
		}

		@media (prefers-color-scheme: dark) {
			.title {
				fill: #f9fafb;
			}
		}</style>

	<g transform="translate(80 80)">
		<g>
			<rect x="-48" y="-48" width="96" height="96" rx="17" fill="#3492ff" />
			<path d="M-20 16h40v5h-40z" fill="#fff">
				<animate
					attributeName="opacity"
					values="1;1;0;0;1"
					keyTimes="0;0.48;0.5;0.98;1"
					dur="1s"
					repeatCount="indefinite"
				/>
			</path>
		</g>
	</g>

	<g transform="translate(152)">
		<text class="title" x="0" y="92" textLength="328" lengthAdjust="spacingAndGlyphs">Lodash Challenges</text>
	</g>
</svg>
